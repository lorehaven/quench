[package]
name = "quench-db-example"
version = "0.1.0"
edition = { workspace = true }
authors = { workspace = true }
description = "Example of using quench-db for migrations and CRUD operations"
publish = false

[[bin]]
name = "db_example"
path = "src/main.rs"

[dependencies]
quench-log = { workspace = true }
quench-db = { workspace = true, features = ["postgres", "tls"] }
