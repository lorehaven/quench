[package]
name = "quench-android-surface"
version = "0.1.5"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - the program side of an Android app drawn by the native renderer: reads touch, key and text events from the Kotlin host, sends it frames, keyboard requests, the text field state and the accessibility tree"
keywords = ["android", "ui", "native", "surface"]
categories = ["gui"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[lib]
name = "quench_android_surface"
path = "src/lib.rs"

[dependencies]
quench-raster = { workspace = true }
quench-serde = { workspace = true }
quench-ui = { workspace = true }
