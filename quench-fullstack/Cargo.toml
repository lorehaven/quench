[package]
name = "quench-fullstack"
version = "0.1.2"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - serves quench-ui apps from quench-http and lets them call server functions: server-side rendering, hashed assets, typed calls, sessions"
keywords = ["ui", "ssr", "wasm", "http"]
categories = ["web-programming", "wasm"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[lib]
name = "quench_fullstack"
path = "src/lib.rs"
harness = false

# What the browser build needs too: the shared types, the typed call, the macro.
[dependencies]
quench-core = { workspace = true }
quench-fullstack-macros = { workspace = true }
quench-serde = { workspace = true }
quench-ui = { workspace = true }
quench-ui-web = { workspace = true }

# The server only. `ring` (through quench-crypto) does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
quench-archive = { workspace = true }
quench-auth = { workspace = true, features = ["http"] }
quench-crypto = { workspace = true }
quench-http = { workspace = true }
quench-log = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-proto = { workspace = true }
quench-test = { workspace = true }
