[package]
name = "quench-fullstack"
version = "0.1.0"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - serves quench-ui apps from quench-http: server-side rendering, hydration markup, content-hashed assets and a strict Content-Security-Policy"
keywords = ["ui", "ssr", "wasm", "http"]
categories = ["web-programming", "wasm"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[lib]
name = "quench_fullstack"
path = "src/lib.rs"
harness = false

[dependencies]
quench-archive = { workspace = true }
quench-core = { workspace = true }
quench-crypto = { workspace = true }
quench-http = { workspace = true }
quench-ui = { workspace = true }
quench-ui-web = { workspace = true }

[lints]
workspace = true

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-proto = { workspace = true }
quench-test = { workspace = true }
tokio = { workspace = true }
