[package]
name = "quench-tool"
version = "0.1.0"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - the `quench` command: new projects, a dev loop with live reload, release builds, doctor and tests for quench-ui apps"
keywords = ["cli", "wasm", "development", "tools"]
categories = ["command-line-utilities", "development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[lib]
name = "quench_tool"
path = "src/lib.rs"

[[bin]]
name = "quench"
path = "src/main.rs"

[dependencies]
quench-args = { workspace = true }
quench-serde = { workspace = true }
quench-template = { workspace = true }

[lints]
workspace = true

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }
