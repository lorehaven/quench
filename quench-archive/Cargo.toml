[package]
name = "quench-archive"
version = "0.1.2"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - archives and compression with no dependencies: tar, zip, deflate, gzip and zstd (decoder and encoder)"
keywords = ["tar", "zip", "zstd", "gzip", "deflate"]
categories = ["compression", "encoding"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[lib]
name = "quench_archive"
path = "src/lib.rs"
harness = false

[lints]
workspace = true

[[test]]
name = "tar"
path = "tests/tar.rs"
harness = false

[[test]]
name = "zip"
path = "tests/zip.rs"
harness = false

[[test]]
name = "zstd"
path = "tests/zstd.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }
