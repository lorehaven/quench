[package]
name = "quench-core"
version = "0.1.7"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - dependency-free foundations: time, uuid, base64/hex, errors, env, collections, versions"
keywords = ["time", "uuid", "base64", "error", "utilities"]
categories = ["rust-patterns", "date-and-time", "encoding"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[lib]
name = "quench_core"
path = "src/lib.rs"
harness = false

[dependencies]
quench-core-macros = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
quench-test = { workspace = true }

[[test]]
name = "async_trait"
path = "tests/async_trait.rs"
harness = false

[[test]]
name = "error_derive"
path = "tests/error_derive.rs"
harness = false

[[test]]
name = "registry"
path = "tests/registry.rs"
harness = false
