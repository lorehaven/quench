[package]
name = "quench-crypto"
version = "0.1.6"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - hashing, HMAC, Ed25519, RSA verification, PBKDF2, Argon2id and JWT on ring"
keywords = ["crypto", "jwt", "argon2", "ed25519"]
categories = ["cryptography"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }

[lib]
name = "quench_crypto"
path = "src/lib.rs"
harness = false

[dependencies]
quench-core = { workspace = true }
quench-serde = { workspace = true, optional = true }
ring = { workspace = true }

[features]
default = ["argon2", "ed25519", "rsa", "jwt", "totp", "aead", "x25519", "age"]
# Argon2id password hashing (and the BLAKE2b it is built on).
argon2 = []
# Ed25519 signing keys and verification.
ed25519 = []
# RSA PKCS#1 v1.5 verification.
rsa = []
# One-time passwords: HOTP (RFC 4226) and TOTP (RFC 6238), with `otpauth://` URLs.
totp = []
# ChaCha20-Poly1305 and XChaCha20-Poly1305 authenticated encryption.
aead = []
# X25519 key agreement for stored keys.
x25519 = []
# age file encryption (X25519 recipients).
age = ["aead", "x25519"]
# JSON Web Tokens; needs the signature schemes it supports.
jwt = ["dep:quench-serde", "ed25519", "rsa"]

[lints]
workspace = true

[dev-dependencies]
quench-test = { workspace = true }

[[test]]
name = "security_jwt"
path = "tests/security_jwt.rs"
required-features = ["jwt"]
harness = false
