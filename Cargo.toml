[workspace]
members = [
  "quench-auth",
  "quench-cache",
  "quench-cli",
  "quench-client",
  "quench-config",
  "quench-db",
  "quench-http",
  "quench-http-macros",
  "quench-log",
  "quench-starter",
  "quench-web",
  "quench-web-components",
  "examples/*",
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Paweł Walus <pawel.walus@protonmail.com>"]
homepage = "https://github.com/lorehaven/quench"
repository = "https://github.com/lorehaven/quench"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
actix-router = { version = "0.5", default-features = false }
actix-service = { version = "2.0" }
actix-web = { version = "4.14", features = ["rustls-0_23"] }
anyhow = { version = "1.0" }
argon2 = { version = "0.5" }
async-trait = { version = "0.1" }
axum = { version = "0.8", features = ["json"] }
base64 = { version = "0.23" }
bytestring = { version = "1.5" }
chrono = { version = "0.4", features = ["serde"] }
# Pinned to match actix-web 4.14's own `cookie` dependency exactly (see
# actix-web's Cargo.toml: `cookie = "0.16"`) - `actix_web::cookie` is
# `pub use cookie;`, so `crate::domain::realm`'s `Cookie<'static>` return
# type has to be the *same* crate/version for `HttpResponse::add_cookie`
# (still actix-web-typed) to accept it, or the actix side of quench-auth
# stops compiling the moment it's ported to build on a shared realm module.
cookie = { version = "0.16" }
crossterm = { version = "0.29" }
dashmap = { version = "6.2" }
dotenvy = { version = "0.15" }
envmnt = { version = "0.10" }
fluent-syntax = { version = "0.12" }
futures-util = { version = "0.3" }
hex = { version = "0.4" }
html5ever = { version = "0.39" }
http = { version = "1.5" }
http-body-util = { version = "0.1" }
hyper = { version = "1.11" }
hyper-util = { version = "0.1" }
inventory = { version = "0.3" }
jsonwebtoken = { version = "11.0", features = ["aws_lc_rs"] }
markup5ever_rcdom = { version = "0.39" }
multer = { version = "3.1" }
proc-macro2 = { version = "1.0" }
quench-auth = { path = "quench-auth", registry = "ennor", version = "0.4.0" }
quench-cache = { path = "quench-cache", registry = "ennor", version = "0.1.7" }
quench-cli = { path = "quench-cli", registry = "ennor", version = "0.1.2" }
quench-client = { path = "quench-client", registry = "ennor", version = "0.2.2" }
quench-config = { path = "quench-config", registry = "ennor", version = "0.1.2" }
quench-db = { path = "quench-db", registry = "ennor", version = "0.2.1" }
quench-http = { path = "quench-http", registry = "ennor", version = "0.1.0" }
quench-http-macros = { path = "quench-http-macros", registry = "ennor", version = "0.1.0" }
quench-log = { path = "quench-log", registry = "ennor", version = "0.1.0" }
quench-starter = { path = "quench-starter", registry = "ennor", version = "0.4.0" }
quench-web = { path = "quench-web", registry = "ennor", version = "0.1.11" }
quench-web-components = { path = "quench-web-components", registry = "ennor", version = "0.1.5" }
quote = { version = "1.0" }
redis = { version = "1.5", features = ["tokio-comp", "cluster-async", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls",
  "cookies",
  "multipart",
  "form",
] }
rustls = { version = "0.23", features = ["ring"] }
rustyline = { version = "18.0" }
semver = { version = "1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
serde_urlencoded = { version = "0.7" }
serde_yaml = { version = "0.9" }
sha2 = { version = "0.11" }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "macros", "json", "chrono", "uuid"] }
strum = { version = "0.28" }
strum_macros = { version = "0.28" }
syn = { version = "3.0", features = ["full"] }
tempfile = { version = "3.27" }
thiserror = { version = "2.0" }
tokio = { version = "1.53", features = ["full"] }
tokio-rustls = { version = "0.26" }
toml = { version = "1.1" }
tower-http = { version = "0.7", features = ["fs"] }
tracing = { version = "0.1" }
tracing-appender = { version = "0.2" }
tracing-subscriber = { version = "0.3" }
urlencoding = { version = "2.1" }
uuid = { version = "1.24", features = ["v4"] }
walkdir = { version = "2.5" }
which = { version = "8.0" }

[profile.release]
strip = "debuginfo"
