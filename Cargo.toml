[workspace]
members = [
  "quench-args",
  "quench-args-macros",
  "quench-auth",
  "quench-cache",
  "quench-cli",
  "quench-client",
  "quench-config",
  "quench-core",
  "quench-core-macros",
  "quench-crypto",
  "quench-db",
  "quench-http",
  "quench-http-macros",
  "quench-k8s",
  "quench-log",
  "quench-log-macros",
  "quench-schema",
  "quench-serde",
  "quench-serde-macros",
  "quench-mail",
  "quench-starter",
  "quench-web",
  "quench-web-components",
  "quench-proto",
  "quench-tls",
  "quench-tz",
  "quench-qr",
  "quench-archive",
  "quench-template",
  "quench-pdf",
  "quench-convert",
  "quench-html",
  "quench-test",
  "quench-test-macros",
  "quench-test-bdd",
  "quench-test-bdd-macros",
  "quench-pg",
  "quench-redis",
  "quench-regex",
  "examples/*",
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["Paweł Walus <pawel.walus@protonmail.com>"]
homepage = "https://github.com/lorehaven/quench"
repository = "https://github.com/lorehaven/quench"
license = "MIT"
readme = "README.md"

[workspace.dependencies]
libc = { version = "0.2" }
getrandom = { version = "0.4" }
proc-macro2 = { version = "1.0" }
quench-args = { path = "quench-args", registry = "ennor", version = "0.1.0" }
quench-args-macros = { path = "quench-args-macros", registry = "ennor", version = "0.1.0" }
quench-auth = { path = "quench-auth", registry = "ennor", version = "0.4.0", default-features = false }
quench-cache = { path = "quench-cache", registry = "ennor", version = "0.1.7" }
quench-cli = { path = "quench-cli", registry = "ennor", version = "0.1.2", default-features = false }
quench-client = { path = "quench-client", registry = "ennor", version = "0.2.2", default-features = false }
quench-config = { path = "quench-config", registry = "ennor", version = "0.1.2" }
quench-core = { path = "quench-core", registry = "ennor", version = "0.1.0" }
quench-crypto = { path = "quench-crypto", registry = "ennor", version = "0.1.0", default-features = false }
quench-core-macros = { path = "quench-core-macros", registry = "ennor", version = "0.1.0" }
quench-db = { path = "quench-db", registry = "ennor", version = "0.2.1", default-features = false }
quench-http = { path = "quench-http", registry = "ennor", version = "0.1.0", default-features = false }
quench-http-macros = { path = "quench-http-macros", registry = "ennor", version = "0.1.0" }
quench-k8s = { path = "quench-k8s", registry = "ennor", version = "0.1.0" }
quench-log = { path = "quench-log", registry = "ennor", version = "0.1.0" }
quench-log-macros = { path = "quench-log-macros", registry = "ennor", version = "0.1.0" }
quench-schema = { path = "quench-schema", registry = "ennor", version = "0.1.0" }
quench-serde = { path = "quench-serde", registry = "ennor", version = "0.1.0" }
quench-serde-macros = { path = "quench-serde-macros", registry = "ennor", version = "0.1.0" }
quench-mail = { path = "quench-mail", registry = "ennor", version = "0.1.0" }
quench-starter = { path = "quench-starter", registry = "ennor", version = "0.4.0" }
quench-web = { path = "quench-web", registry = "ennor", version = "0.1.11" }
quench-proto = { path = "quench-proto", registry = "ennor", version = "0.1.0", default-features = false }
quench-tz = { path = "quench-tz", registry = "ennor", version = "0.1.0" }
quench-tls = { path = "quench-tls", registry = "ennor", version = "0.1.0" }
quench-qr = { path = "quench-qr", registry = "ennor", version = "0.1.0" }
quench-test = { path = "quench-test", registry = "ennor", version = "0.1.0" }
quench-test-bdd = { path = "quench-test-bdd", registry = "ennor", version = "0.1.0" }
quench-test-bdd-macros = { path = "quench-test-bdd-macros", registry = "ennor", version = "0.1.0" }
quench-test-macros = { path = "quench-test-macros", registry = "ennor", version = "0.1.0" }
quench-html = { path = "quench-html", registry = "ennor", version = "0.1.0" }
quench-convert = { path = "quench-convert", registry = "ennor", version = "0.1.0" }
quench-pdf = { path = "quench-pdf", registry = "ennor", version = "0.1.0" }
quench-template = { path = "quench-template", registry = "ennor", version = "0.1.0" }
quench-archive = { path = "quench-archive", registry = "ennor", version = "0.1.0" }
quench-pg = { path = "quench-pg", registry = "ennor", version = "0.1.0", default-features = false }
quench-regex = { path = "quench-regex", registry = "ennor", version = "0.1.0" }
quench-redis = { path = "quench-redis", registry = "ennor", version = "0.1.0", default-features = false }
quench-web-components = { path = "quench-web-components", registry = "ennor", version = "0.1.5" }
quote = { version = "1.0" }
ring = { version = "0.17", default-features = false, features = ["alloc", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
syn = { version = "3.0", features = ["full"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
webpki-roots = { version = "1.0" }

# Password hashing is memory-hard on purpose; run it optimised even in tests.
[profile.dev.package.quench-crypto]
opt-level = 3

[profile.release]
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
fn_params_excessive_bools = "allow"
