[package]
name = "quench-proto"
version = "0.1.7"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - HTTP types, an HTTP/1.1 codec, cookies, WebSocket framing and a thin rustls glue, shared by quench-http and quench-client"
keywords = ["http", "protocol", "websocket"]
categories = ["network-programming", "web-programming"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[lib]
name = "quench_proto"
path = "src/lib.rs"
harness = false

[dependencies]
quench-core = { workspace = true }
quench-crypto = { workspace = true, optional = true }
quench-tls = { workspace = true, optional = true }
tokio = { workspace = true, features = ["io-util", "net", "sync", "time"] }

[features]
default = ["server", "client", "ws", "multipart", "sse", "tls"]
# The HTTP/1.1 connection drivers; the codec in `h1::{parse, decode, reader}` is always built.
server = []
client = []
# RFC 6455 framing and handshake.
ws = ["dep:quench-crypto"]
multipart = []
sse = []
# Re-exports `quench-tls` as `quench_proto::tls`; pulls in rustls and ring.
tls = ["dep:quench-tls"]




[dev-dependencies]
quench-test = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true

[[test]]
name = "h1_client"
path = "tests/h1_client.rs"
required-features = ["client", "server"]
harness = false

[[test]]
name = "h1_server"
path = "tests/h1_server.rs"
required-features = ["server"]
harness = false

[[test]]
name = "throughput"
path = "tests/throughput.rs"
required-features = ["client", "server"]
harness = false
