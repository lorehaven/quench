[package]
name = "quench-cache"
version = "0.1.20"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - caching: in-process by default, Redis behind the `redis` feature"
keywords = ["cache", "redis", "performance"]
categories = ["caching"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[dependencies]
quench-core = { workspace = true }
quench-serde = { workspace = true }
quench-redis = { workspace = true, optional = true }

[features]
default = ["request-cache", "data-cache", "tls"]
redis = ["dep:quench-redis", "data-cache"]
# `rediss://` for the Redis store; has no effect without `redis`.
tls = ["quench-redis?/tls"]
request-cache = []
data-cache = []

[dev-dependencies]
quench-test = { workspace = true }
quench-core = { workspace = true }
quench-redis = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[[test]]
name = "from_env"
path = "tests/from_env.rs"
required-features = ["redis"]
harness = false

[[test]]
name = "redis_store"
path = "tests/redis_store.rs"
required-features = ["redis"]
harness = false

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false
