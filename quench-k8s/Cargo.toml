[package]
name = "quench-k8s"
version = "0.1.2"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - a generic Kubernetes API client: kubeconfig and in-cluster auth, dynamic resources, discovery, logs and watches"
keywords = ["kubernetes", "k8s", "client", "api"]
categories = ["api-bindings", "network-programming"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[lib]
name = "quench_k8s"
path = "src/lib.rs"

[dependencies]
quench-client = { workspace = true, features = ["tls"] }
quench-core = { workspace = true }
quench-serde = { workspace = true, features = ["yaml"] }

[dev-dependencies]
quench-test = { workspace = true }
quench-http = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net"] }

[lints]
workspace = true

[[test]]
name = "api"
path = "tests/api.rs"
harness = false

[[test]]
name = "config"
path = "tests/config.rs"
harness = false
