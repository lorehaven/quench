[package]
name = "quench-desktop"
version = "0.1.0"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - the Linux desktop host: a GTK window around webkit2gtk that serves an app's embedded assets and carries its plugin bridge"
keywords = ["desktop", "webview", "gtk", "linux"]
categories = ["gui"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[lib]
name = "quench_desktop"
path = "src/lib.rs"

[dependencies]
quench-core = { workspace = true }
quench-serde = { workspace = true }

[lints]
workspace = true

[[bin]]
name = "quench-desktop-fixture"
path = "tests/fixture/main.rs"
test = false
doc = false

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }
