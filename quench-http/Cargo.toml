[package]
name = "quench-http"
version = "0.1.11"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - lightweight HTTP framework with annotation-driven discovery and dependency injection"
keywords = ["development", "tools"]
categories = ["development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }

[lib]
name = "quench_http"
path = "src/lib.rs"

[dependencies]
quench-log = { workspace = true }
quench-core = { workspace = true }
quench-http-macros = { workspace = true }
quench-proto = { workspace = true, features = ["server", "ws", "multipart", "sse"] }
quench-serde = { workspace = true }
rustls = { workspace = true, optional = true }
tokio = { workspace = true }

[features]
default = ["tls"]
# `serve_https`, `load_tls` and the rustls types in their signatures.
tls = ["dep:rustls", "quench-proto/tls"]

[dev-dependencies]
quench-proto = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
