[package]
name = "quench-client"
version = "0.2.15"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - HTTP client abstraction with auth and retry support"
keywords = ["http", "client", "rest"]
categories = ["network-programming"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[dependencies]
quench-log = { workspace = true }
quench-core = { workspace = true }
quench-proto = { workspace = true, features = ["client"] }
quench-serde = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "net"] }

[features]
default = ["tls"]
# `https://` support (rustls). Without it every `https` URL fails with a transport error.
tls = ["quench-proto/tls"]
# `quench_client::blocking`: the same client for synchronous programs (a private tokio runtime per client).
blocking = ["tokio/rt"]


[dev-dependencies]
quench-test = { workspace = true }
quench-http = { workspace = true, features = ["tls"] }
tokio = { workspace = true }

[lints]
workspace = true

[lib]
harness = false

[[test]]
name = "blocking"
path = "tests/blocking.rs"
required-features = ["blocking"]
harness = false

[[test]]
name = "transport"
path = "tests/transport.rs"
harness = false

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false
