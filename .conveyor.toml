# Every push to master, and every pull request.
on = { push = ["master"], pull_request = ["*"] }

# ---------------------------------------------------------------- check
[[stage]]
name = "check"

[[stage.job]]
name  = "format"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
steps = [{ anvil = "format --check" }]

[[stage.job]]
name  = "lint"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
steps = [{ anvil = "lint --all-targets --deny-warnings" }]

[[stage.job]]
name  = "deps"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
steps = [{ anvil = "machete" }, { anvil = "audit" }, { anvil = "deny" }]

[[stage.job]]
name  = "semver-check"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
# Every package here is published to `ennor` and consumed elsewhere (forge's
# workspace.dependencies pulls all nine directly), so a breaking change in
# any of them is worth catching before it reaches a dependent's next build.
#
# conveyor's checkout is a shallow, single-commit clone - `anvil
# semver-check`'s default baseline is the commit before a package's last
# version bump, which isn't on disk yet at depth 1. If this job's origin
# fetch needs a credential the initial checkout didn't persist into
# .git/config, give it one via `secrets`.
steps = [
  { run = "git fetch --unshallow origin" },
  { anvil = "semver-check -p quench-auth" },
  { anvil = "semver-check -p quench-cache" },
  { anvil = "semver-check -p quench-cli" },
  { anvil = "semver-check -p quench-client" },
  { anvil = "semver-check -p quench-config" },
  { anvil = "semver-check -p quench-db" },
  { anvil = "semver-check -p quench-starter" },
  { anvil = "semver-check -p quench-web" },
  { anvil = "semver-check -p quench-web-components" },
]

# ---------------------------------------------------------------- build
[[stage]]
name  = "build"
needs = ["check"]

[[stage.job]]
name  = "workspace"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
steps = [{ anvil = "build --all" }]

# ---------------------------------------------------------------- test
[[stage]]
name  = "test"
needs = ["build"]

[[stage.job]]
name  = "unit"
image = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
env   = { RUST_BACKTRACE = "1" }
# nextest for speed on the bulk of the suite; it doesn't run doctests, so
# those still go through plain `cargo test --doc`.
steps = [{ anvil = "nextest --all" }, { run = "cargo test --doc --workspace" }]

[[stage.job]]
name      = "coverage"
image     = "ossiriand.arda:8080/forge/ci/rust-builder:latest"
env       = { RUST_BACKTRACE = "1" }
steps     = [{ run = "cargo llvm-cov --workspace --lcov --output-path lcov.info" }]
artifacts = ["lcov.info"]
