title: Quench
description: A dependency-free Rust framework - crates, guides and reference
exclude:
  - migration/
  - _reports/
  - _style.md
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "crates"
    values:
      render_with_liquid: false
  - scope:
      path: "guides"
    values:
      render_with_liquid: false
  - scope:
      path: "examples"
    values:
      render_with_liquid: false
  - scope:
      path: "index.md"
    values:
      render_with_liquid: false
# the pages document template engines and format strings: `{{` and `{%` in them are text, so Liquid is off for them
