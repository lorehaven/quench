title: Quench
description: A dependency-free Rust framework - crates, guides and reference
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
relative_links:
  enabled: true
  collections: false
search_enabled: true
heading_anchors: true
color_scheme: dark
back_to_top: true
back_to_top_text: "Back to top"
exclude:
  - migration/
  - _reports/
  - _style.md
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "crates"
    values:
      render_with_liquid: false
  - scope:
      path: "guides"
    values:
      render_with_liquid: false
  - scope:
      path: "examples"
    values:
      render_with_liquid: false
  - scope:
      path: "index.md"
    values:
      render_with_liquid: false
# the pages document template engines and format strings: `{{` and `{%` in them are text, so Liquid is off for them
