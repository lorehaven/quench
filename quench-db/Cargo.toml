[package]
name = "quench-db"
version = "0.2.9"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench DB - a simple ORM and database abstraction layer"
keywords = ["database", "orm", "postgres"]
categories = ["database"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"

[lib]
name = "quench_db"
path = "src/lib.rs"

[dependencies]
quench-log = { workspace = true }
quench-core = { workspace = true }
quench-crypto = { workspace = true }
quench-serde = { workspace = true }
quench-pg = { workspace = true, optional = true }

[features]
default = ["postgres", "tls"]
# The Postgres backend, `Db::Postgres` and the migration runner. Without it only the in-memory
# backend, the catalog and the migration planner are built.
postgres = ["dep:quench-pg"]
# `sslmode=require|verify-full` for Postgres; has no effect without `postgres`.
tls = ["quench-pg?/tls"]

[[test]]
name = "postgres_backend"
required-features = ["postgres"]

[[test]]
name = "postgres_runner"
required-features = ["postgres"]

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
