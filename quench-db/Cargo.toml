[package]
name = "quench-db"
version = "0.2.16"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench DB - a simple ORM and database abstraction layer"
keywords = ["database", "orm", "postgres", "sqlite"]
categories = ["database"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"
autotests = false

[lib]
name = "quench_db"
path = "src/lib.rs"

[dependencies]
quench-log = { workspace = true }
quench-core = { workspace = true }
quench-crypto = { workspace = true }
quench-serde = { workspace = true }
quench-pg = { workspace = true, optional = true }
quench-sqlite = { workspace = true, optional = true }

[features]
default = ["postgres", "tls"]
# The Postgres backend, `Db::Postgres` and the migration runner. Without it only the in-memory
# backend, the catalog and the migration planner are built.
postgres = ["dep:quench-pg"]
# `sslmode=require|verify-full` for Postgres; has no effect without `postgres`.
tls = ["quench-pg?/tls"]
# The SQLite backend (`SqliteDb`, `Db::Sqlite`, `sqlite:path` URLs), on `quench-sqlite`.
sqlite = ["dep:quench-sqlite"]



[dev-dependencies]
quench-test = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[[test]]
name = "catalog_errors"
path = "tests/catalog_errors.rs"
harness = false

[[test]]
name = "catalog_plan"
path = "tests/catalog_plan.rs"
harness = false

[[test]]
name = "postgres_backend"
path = "tests/postgres_backend.rs"
required-features = ["postgres"]
harness = false

[[test]]
name = "postgres_runner"
path = "tests/postgres_runner.rs"
required-features = ["postgres"]
harness = false

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[[test]]
name = "sqlite_backend"
path = "tests/sqlite_backend.rs"
required-features = ["sqlite"]
harness = false
