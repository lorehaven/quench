[package]
name = "quench-text"
version = "0.1.4"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - fonts and text with no dependencies: a TrueType parser, kerning, line breaking, Noto Sans embedded, drawn through quench-raster"
keywords = ["font", "truetype", "text", "layout"]
categories = ["text-processing", "rendering"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false
include = ["src/**", "tests/**", "fonts/**", "Cargo.toml"]

[lib]
name = "quench_text"
path = "src/lib.rs"

[dependencies]
quench-raster = { workspace = true }

[lints]
workspace = true

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-core = { workspace = true }
quench-test = { workspace = true }
