[package]
name = "quench-cli"
version = "0.1.15"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench CLI and REPL with unified toolbox-style terminal UI"
keywords = ["development", "tools"]
categories = ["development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"
autotests = false

[lib]
name = "quench_cli"
path = "src/lib.rs"
harness = false

[features]
default = ["repl"]
# Terminal control on Unix: key events, size, no-echo password prompt, screen sequences.
tui = []
# The interactive line editor and REPL loop (raw mode through `stty`).
repl = ["tui"]


[dependencies]
quench-core = { workspace = true }

[dev-dependencies]
quench-test = { workspace = true }

[lints]
workspace = true

[[test]]
name = "pty"
path = "tests/pty.rs"
required-features = ["repl"]
harness = false

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false
