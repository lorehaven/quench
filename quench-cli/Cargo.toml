[package]
name = "quench-cli"
version = "0.1.13"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench CLI and REPL with unified toolbox-style terminal UI"
keywords = ["development", "tools"]
categories = ["development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"
autotests = false

[lib]
name = "quench_cli"
path = "src/lib.rs"
harness = false

[features]
default = ["repl"]
# Terminal control on Unix: key events, size, no-echo password prompt, screen sequences. Pulls in `libc`.
tui = ["dep:libc"]
# The interactive line editor and REPL loop (raw mode through `libc`).
repl = ["tui"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }


[dev-dependencies]
quench-test = { workspace = true }
quench-core = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[lints]
workspace = true

[[test]]
name = "pty"
path = "tests/pty.rs"
required-features = ["repl"]
harness = false

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false
