[package]
name = "quench-starter"
version = "0.4.16"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - server bootstrap and utilities"
keywords = ["development", "tools"]
categories = ["development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
autotests = false

[lib]
name = "quench_starter"
path = "src/lib.rs"
harness = false

[dependencies]
quench-cli = { workspace = true, features = ["repl"] }
quench-core = { workspace = true }
quench-serde = { workspace = true }
quench-auth = { workspace = true, features = ["http", "redis", "postgres", "tls"] }
quench-db = { workspace = true, features = ["postgres", "tls"] }
quench-http = { workspace = true, features = ["tls"] }
quench-log = { workspace = true }
quench-web = { workspace = true }
quench-client = { workspace = true, features = ["tls"] }
tokio = { workspace = true }

[lints]
workspace = true

[[test]]
name = "boot"
path = "tests/boot.rs"
harness = false

[[test]]
name = "http_health"
path = "tests/http_health.rs"
harness = false

[[test]]
name = "http_ui_redirects"
path = "tests/http_ui_redirects.rs"
harness = false

[[test]]
name = "unit"
path = "tests/unit.rs"
harness = false

[dev-dependencies]
quench-test = { workspace = true }
