[package]
name = "quench-auth"
version = "0.4.7"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - authentication and JWT handling"
keywords = ["development", "tools"]
categories = ["development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"

[lib]
name = "quench_auth"
path = "src/lib.rs"

[dependencies]
quench-log = { workspace = true }
quench-cache = { workspace = true }
quench-core = { workspace = true }
quench-crypto = { workspace = true, features = ["argon2", "jwt"] }
quench-db = { workspace = true }
quench-proto = { workspace = true }
quench-serde = { workspace = true }
quench-http = { workspace = true, optional = true }
quench-client = { workspace = true }
tokio = { workspace = true }

[features]
default = ["http", "redis", "postgres", "tls"]
# The quench-http layer: `Auth`/`RequireWrite` middleware, the UI routers and the SSO request
# helpers. The framework-agnostic `domain` is always built.
http = ["dep:quench-http"]
# Redis-backed session and data caches.
redis = ["quench-cache/redis"]
# The Postgres user store.
postgres = ["quench-db/postgres"]
# `https://` for the SSO and JWKS clients, `rediss://` and `sslmode=require` for the stores.
tls = ["quench-client/tls", "quench-http?/tls", "quench-db/tls", "quench-cache/tls"]

[[test]]
name = "http_middleware_auth"
required-features = ["http"]

[[test]]
name = "http_middleware_require_write"
required-features = ["http"]

[[test]]
name = "http_sso_client"
required-features = ["http"]

[[test]]
name = "http_ui"
required-features = ["http"]

[lints]
workspace = true
