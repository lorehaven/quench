[package]
name = "quench-auth"
version = "0.4.4"
edition = { workspace = true }
authors = { workspace = true }
description = "Quench - authentication and JWT handling"
keywords = ["development", "tools"]
categories = ["development-tools"]
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
readme = "README.md"

[lib]
name = "quench_auth"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
argon2 = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
cookie = { workspace = true }
ed25519-dalek = { version = "3", features = ["alloc", "pkcs8"] }
envmnt = { workspace = true }
getrandom = { version = "0.4" }
jsonwebtoken = { workspace = true }
quench-cache = { workspace = true, features = ["redis"] }
quench-db = { workspace = true }
quench-http = { workspace = true }
quench-client = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
bytes = { version = "1.12" }
http = { workspace = true }
http-body-util = { workspace = true }

[lints]
workspace = true
